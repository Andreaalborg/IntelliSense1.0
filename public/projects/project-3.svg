<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="B2B-rådgivning">
  <defs>
    <linearGradient id="bgproject3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="panelproject3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadowproject3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bgproject3)"/>
  <!-- soft orbs -->
  <circle cx="980" cy="140" r="160" fill="#c4b5fd" fill-opacity="0.25"/>
  <circle cx="180" cy="680" r="200" fill="#1e1b4b" fill-opacity="0.45"/>
  <!-- browser chrome card -->
  <g filter="url(#shadowproject3)">
    <rect x="140" y="110" width="920" height="580" rx="22" fill="#0b1220" fill-opacity="0.55"/>
    <rect x="140" y="110" width="920" height="56" rx="22" fill="#0b1220" fill-opacity="0.85"/>
    <rect x="140" y="150" width="920" height="16" fill="#0b1220" fill-opacity="0.85"/>
    <circle cx="178" cy="138" r="7" fill="#f87171"/>
    <circle cx="202" cy="138" r="7" fill="#fbbf24"/>
    <circle cx="226" cy="138" r="7" fill="#4ade80"/>
    <rect x="270" y="126" width="520" height="24" rx="12" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="160" y="186" width="880" height="480" rx="14" fill="url(#panelproject3)"/>
    <!-- mock UI blocks -->
    <rect x="200" y="230" width="280" height="28" rx="8" fill="#fff" fill-opacity="0.85"/>
    <rect x="200" y="280" width="420" height="16" rx="6" fill="#fff" fill-opacity="0.35"/>
    <rect x="200" y="310" width="360" height="16" rx="6" fill="#fff" fill-opacity="0.25"/>
    <rect x="200" y="360" width="160" height="44" rx="12" fill="#6366f1" fill-opacity="0.95"/>
    <rect x="620" y="230" width="380" height="220" rx="16" fill="#fff" fill-opacity="0.12"/>
    <rect x="200" y="440" width="800" height="160" rx="16" fill="#fff" fill-opacity="0.08"/>
  </g>
  <text x="600" y="740" text-anchor="middle" fill="rgba(255,255,255,0.92)" font-family="ui-sans-serif,system-ui,sans-serif" font-size="36" font-weight="700">B2B-rådgivning</text>
</svg>
